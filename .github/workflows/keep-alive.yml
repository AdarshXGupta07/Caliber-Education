name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes of no
# incoming requests, so the next real request pays a cold-start delay
# (10-60s). This pings the public health endpoint every 10 minutes to keep
# the instance warm, so students never hit that delay during normal use.
#
# Uses the same BACKEND_URL repository secret as purge-old-files.yml
# (Settings → Secrets and variables → Actions) — no new secret needed.
#
# This is a stopgap for the free tier, not a permanent fix: it does not
# reduce cold starts to zero (GitHub's scheduler can occasionally skip or
# delay a run under load), and running the instance continuously uses more
# of Render's free monthly runtime hours than letting it sleep during truly
# idle periods would. If you later know your real idle window, narrow the
# cron schedule below to your active hours instead of running 24/7.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" "${{ secrets.BACKEND_URL }}/")
          echo "HTTP $code"
          cat /tmp/out.json
